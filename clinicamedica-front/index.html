<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Médica - Dr. Ved</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <img src="./img/ChatGPT Image 19 de ago. de 2026, 07_55_36.png" alt="Dr. Ved">

        <div>
            <h1>Clínica Médica</h1>
            <p>Dr. Ved - Excelência no atendimento de todas as espécies</p>
        </div>

        <div class="tag-urologista">UROLOGISTA</div>
    </header>

    <div class="container">

        <!-- Galeria de Atendimentos -->
        <section class="card">
            <h2>Galeria de Atendimentos</h2>
            <div class="gallery">
                <img src="./img/ChatGPT Image 19 de ago. de 2026, 07_55_26.png" alt="Atendimento Paciente Humano"
                    title="Atendimento humanizado">
                <img src="./img/ChatGPT Image 19 de ago. de 2026, 07_55_33.png" alt="Atendimento Paciente Madeira"
                    title="Tratamento ortopédico especializado">
                <img src="./img/ChatGPT Image 19 de ago. de 2026, 07_55_29.png" alt="Atendimento Tubarão"
                    title="Especialista em pacientes de águas profundas">
            </div>
        </section>

        <!-- Formulário de Cadastro -->
        <section class="card">
            <h2 id="tituloForm">Novo Paciente</h2>
            <form id="formPaciente">
                <input type="hidden" id="pacienteId">

                <div class="form-group">
                    <label for="nome">Nome do Paciente</label>
                    <input type="text" id="nome" placeholder="Digite o nome do paciente..." required>
                </div>

                <div class="grid-form">
                    <div class="form-group">
                        <label for="especialidade">Especialidade Encaminhada</label>
                        <select id="especialidade" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option value="CLINICA_GERAL">Clínica Geral</option>
                            <option value="PEDIATRIA">Pediatria</option>
                            <option value="CARDIOLOGIA">Cardiologia</option>
                            <option value="ORTOPEDIA">Ortopedia</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" placeholder="Ex: 35" required min="0" max="500">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="planoSaude">
                    <label for="planoSaude">Convênio / Plano de Saúde ativo?</label>
                </div>

                <button type="submit" id="btnSubmit" class="btn btn-primary">Salvar Prontuário</button>
                <button type="button" id="btnCancelar" class="btn btn-cancel" onclick="limparFormulario()">Cancelar
                    Edição</button>
            </form>
        </section>

        <section class="card">
            <h2>Pacientes Registrados</h2>
            <div id="listaPacientes">
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>

</html>
